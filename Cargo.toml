[package]
name = "tuxtune"
version = "0.1.0"
edition = "2024"
description = "A developer-focused Linux system tuner with hardware detection, optimization profiles, and an interactive TUI"
license = "MIT"
repository = "https://github.com/rohansx/tuxtune"
keywords = ["linux", "optimization", "performance", "tui", "developer"]
categories = ["command-line-utilities", "os"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
nix = { version = "0.30", features = ["fs", "user"] }
toml = "0.8"
